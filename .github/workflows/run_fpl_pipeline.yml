# This name will be displayed in the GitHub Actions UI
name: FPL Data Pipeline

# Triggers for the workflow
on:
  # Run this workflow automatically on a schedule (hourly; the gate decides whether the heavy pipeline runs)
  schedule:
    - cron: '0 * * * *'   # hourly; the gate decides whether the heavy pipeline runs

  # This line is ESSENTIAL for the "Run workflow" button to appear
  workflow_dispatch:

  # Run the test suite on every push and PR (see the `test` job below)
  push:
  pull_request:

jobs:
  build:
    # Unchanged from before: only the schedule/workflow_dispatch triggers run the
    # actual pipeline (it writes to the production Google Sheet), not push/pull_request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate — should the pipeline run?
        id: gate
        run: |
          python -m pip install --quiet requests
          echo "run=$(python3 scripts/should_run_gate.py)" >> "$GITHUB_OUTPUT"
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run FPL Data Pipeline
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 data_pipeline.py
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Set up Node
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish dashboard.json to Vercel Blob
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f dashboard.json ]; then
            npm install
            node scripts/publish_blob.mjs
          else
            echo "dashboard.json not produced (pipeline exited early); skipping blob publish."
          fi
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

  test:
    # Independent of the `build` job: guards the money-affecting scoring math
    # in award_calculators.py / data_pipeline.py on every push and PR.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Match your development version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -v